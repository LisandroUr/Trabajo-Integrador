name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: tfi_transaccional
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:6-jammy
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3

    # Backend Node.js Tests
    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
    - name: Install dependencies (Node Backend)
      run: npm ci
      working-directory: ./backend
    
    # GraphQL Gateway Tests
    - name: Install dependencies (GraphQL Gateway)
      run: npm ci
      working-directory: ./graphql-gateway

    # Frontend Tests
    - name: Install dependencies (Frontend)
      run: npm ci
      working-directory: ./frontend
    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend

    # Django Backend Tests
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies (Django Backend)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: ./backend-django
    - name: Run Django Tests
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_USER: admin
        DB_PASSWORD: secretpassword
        DB_NAME: tfi_transaccional
      run: |
        python manage.py test
      working-directory: ./backend-django

    # AI Service Tests
    - name: Set up Python 3.11 for AI Service
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies (AI Service)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: ./ai-service

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'TFI-Ranking-Precios'
        path: '.'
        format: 'HTML'
