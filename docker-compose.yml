version: '3.8'

services:
  # Base de Datos Transaccional (Para Django en Fase 2)
  postgres:
    image: postgres:15-alpine
    container_name: tfi_postgres
    environment:
      POSTGRES_DB: tfi_transaccional
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Base de Datos Documental (Para Node.js)
  mongo:
    image: mongo:6-jammy
    container_name: tfi_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Backend Actual (Node.js)
  backend-node:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tfi_backend_node
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/tfi_db
      - JWT_SECRET=tfi_jwt_super_secret_key_123
      # Agregar aquí otras variables necesarias para el backend
    depends_on:
      - mongo
    restart: on-failure

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tfi_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend-node
    restart: on-failure

volumes:
  postgres_data:
  mongo_data:
